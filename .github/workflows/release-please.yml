name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens/updates a release PR from conventional commits; merging it tags a
      # release and updates CHANGELOG.md and the version in package.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          # PRs opened with the default GITHUB_TOKEN do not trigger CI. Add a
          # fine-grained PAT or GitHub App token as RELEASE_PLEASE_TOKEN
          # (contents, issues and pull requests: write) so release PRs get checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
